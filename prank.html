<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading...</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: sans-serif;
  }

  /* Landing state before click - plain, looks like a normal blank/loading page */
  #landing {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #111;
    color: #aaa;
    font-size: 18px;
    cursor: pointer;
    letter-spacing: 1px;
  }

  /* Fullscreen video overlay */
  #videoOverlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #000;
    z-index: 999;
    align-items: center;
    justify-content: center;
  }

  #videoOverlay.active {
    display: flex;
  }

  #prankVideo {
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
  }
</style>
</head>
<body>

  <div id="landing" onclick="startPrank()">
    Click anywhere to continue
  </div>

  <div id="videoOverlay">
    <video id="prankVideo" src="page_v1.mp4" playsinline></video>
  </div>

  <script>
    function startPrank() {
      const landing = document.getElementById('landing');
      const overlay = document.getElementById('videoOverlay');
      const video = document.getElementById('prankVideo');

      landing.style.display = 'none';
      overlay.classList.add('active');

      video.currentTime = 0;
      video.muted = false;
      video.play().catch(() => {
        // Autoplay with sound may be blocked by the browser - fallback to muted then unmute
        video.muted = true;
        video.play();
      });
    }
  </script>

</body>
</html>
